name: imobile
description: "ImmoTok - TikTok-style real estate mobile app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  provider: ^6.1.2
  video_player: ^2.9.2
  cached_network_image: ^3.4.1
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.4
  google_fonts: ^6.2.1
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
